<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; color: #1c1917; margin: 0; padding: 14px; background: #faf9f6; }
    .row { display: flex; gap: 8px; }
    .row > div { flex: 1; }
    label { display: block; font-weight: 600; margin: 10px 0 4px; }
    select, input, textarea { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #d6d3d1; border-radius: 6px; background: #fff; font-size: 13px; font-family: inherit; }
    textarea { min-height: 150px; resize: vertical; line-height: 1.5; }
    .tabs { display: flex; gap: 6px; margin-top: 10px; }
    .tab-btn { flex: 1; padding: 8px; border: 1px solid #d6d3d1; border-radius: 6px; background: #fff; cursor: pointer; font-weight: 600; font-size: 12px; }
    .tab-btn.active { background: #0f5257; color: #fff; border-color: #0f5257; }
    .btn { margin-top: 12px; padding: 10px; border: none; border-radius: 6px; background: #0f5257; color: #fff; font-weight: 600; cursor: pointer; width: 100%; }
    .hint { font-size: 12px; color: #57534e; margin: 4px 0 6px; }
    .existing { margin-top: 14px; background: #fff; border: 1px solid #e7e5e4; border-radius: 6px; padding: 10px; max-height: 140px; overflow-y: auto; font-size: 12px; }
    .msg { color: #047857; font-weight: 600; margin-top: 8px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="row">
    <div style="flex:2;">
      <label>Khách hàng</label>
      <select id="clientSelect" onchange="loadExisting()"></select>
    </div>
    <div>
      <label>Giai đoạn</label>
      <select id="stageSelect" onchange="onStageChange()">
        <option value="1">Giai đoạn 1</option>
        <option value="2">Giai đoạn 2</option>
        <option value="3">Giai đoạn 3</option>
        <option value="4">Giai đoạn 4</option>
      </select>
    </div>
    <div>
      <label>Đợt (round)</label>
      <input id="roundInput" value="R1" onchange="loadExisting()">
    </div>
  </div>

  <div class="tabs">
    <button id="tabRaw" class="tab-btn active" onclick="setMode('raw')">📄 Ghi chú tự do / Dán Transcript (RAW)</button>
    <button id="tabCoded" class="tab-btn" onclick="setMode('coded')">🏷️ Gắn theo mã câu (f: / a: / g:)</button>
  </div>

  <div id="codeWrap" style="display:none;">
    <label>Chọn mã câu hỏi</label>
    <select id="codeSelect"></select>
  </div>

  <label>Nội dung buổi trực tiếp</label>
  <div id="modeHint" class="hint">Dán thẳng ghi chú thô hoặc transcript buổi họp. LLM sẽ tự ánh xạ về mã câu và gắn thẻ [F]/[A]/[G] khi xuất Bản đánh giá.</div>
  <textarea id="noteText" placeholder="Nhập hoặc dán ghi chú..."></textarea>

  <button id="saveBtn" class="btn" onclick="saveNotes()">💾 Lưu ghi chú vào LiveNotes</button>
  <div id="msgBox" class="msg"></div>

  <div class="existing">
    <strong>Ghi chú đã lưu cho giai đoạn này:</strong>
    <div id="existingList" style="margin-top:6px;color:#57534e;">Đang tải...</div>
  </div>

  <script>
    var allQuestions = [];
    var currentMode = 'raw';

    google.script.run.withSuccessHandler(function (data) {
      allQuestions = data.questions;
      var sel = document.getElementById('clientSelect');
      data.clients.forEach(function (c) {
        var opt = document.createElement('option');
        opt.value = c.client_id;
        opt.textContent = c.client_id + ' – ' + c.name;
        sel.appendChild(opt);
      });
      onStageChange();
    }).adminGetInitData();

    function setMode(m) {
      currentMode = m;
      document.getElementById('tabRaw').className = 'tab-btn' + (m === 'raw' ? ' active' : '');
      document.getElementById('tabCoded').className = 'tab-btn' + (m === 'coded' ? ' active' : '');
      document.getElementById('codeWrap').style.display = m === 'coded' ? 'block' : 'none';
      document.getElementById('modeHint').textContent = m === 'raw'
        ? 'Dán thẳng ghi chú thô hoặc transcript buổi họp. LLM sẽ tự ánh xạ về mã câu và gắn thẻ [F]/[A]/[G] khi xuất Bản đánh giá.'
        : 'Mỗi dòng 1 ý. Có thể gõ đầu dòng f: (Sự thật), a: (Giả định), g: (Mục tiêu). Ví dụ: "f: Đã từ chối hợp đồng 200tr vì lệch giá trị".';
    }

    function onStageChange() {
      var s = parseInt(document.getElementById('stageSelect').value, 10);
      var sel = document.getElementById('codeSelect');
      sel.innerHTML = '';
      allQuestions.filter(function (q) { return q.stage === s; }).forEach(function (q) {
        var opt = document.createElement('option');
        opt.value = q.code;
        opt.textContent = '[' + q.mode + '] ' + q.label;
        sel.appendChild(opt);
      });
      loadExisting();
    }

    function loadExisting() {
      var cid = document.getElementById('clientSelect').value;
      if (!cid) return;
      google.script.run.withSuccessHandler(function (notes) {
        var box = document.getElementById('existingList');
        if (!notes.length) {
          box.textContent = '(Chưa có ghi chú nào)';
          return;
        }
        box.innerHTML = notes.map(function (n) {
          var preview = n.note.length > 140 ? n.note.slice(0, 140) + '…' : n.note;
          return '<div style="margin-bottom:6px;padding-bottom:6px;border-bottom:1px dashed #e7e5e4;">' +
            '<b>[' + n.code + ' / ' + n.tag + ']</b> ' + escapeHtml(preview) + '</div>';
        }).join('');
      }).adminGetLiveNotes(cid, document.getElementById('stageSelect').value, document.getElementById('roundInput').value);
    }

    function saveNotes() {
      var btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.textContent = 'Đang lưu...';
      document.getElementById('msgBox').textContent = '';

      google.script.run
        .withSuccessHandler(function (res) {
          btn.disabled = false;
          btn.textContent = '💾 Lưu ghi chú vào LiveNotes';
          document.getElementById('noteText').value = '';
          document.getElementById('msgBox').textContent = '✅ Đã lưu ' + res.added + ' mục ghi chú.';
          loadExisting();
        })
        .withFailureHandler(function (e) {
          btn.disabled = false;
          btn.textContent = '💾 Lưu ghi chú vào LiveNotes';
          alert(e.message || String(e));
        })
        .adminSaveLiveNotes({
          client_id: document.getElementById('clientSelect').value,
          stage: document.getElementById('stageSelect').value,
          round: document.getElementById('roundInput').value,
          mode: currentMode,
          code: currentMode === 'raw' ? 'RAW' : document.getElementById('codeSelect').value,
          text: document.getElementById('noteText').value
        });
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
