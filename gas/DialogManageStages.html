<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; color: #1c1917; margin: 0; padding: 14px; background: #faf9f6; }
    label.title { display: block; font-weight: 600; margin: 12px 0 6px; }
    select { width: 100%; padding: 8px; border: 1px solid #d6d3d1; border-radius: 6px; background: #fff; font-size: 13px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #fff; padding: 10px; border: 1px solid #e7e5e4; border-radius: 8px; }
    .chk { display: flex; align-items: center; gap: 6px; font-weight: 500; cursor: pointer; }
    .btn { margin-top: 14px; padding: 10px 14px; border: none; border-radius: 6px; background: #0f5257; color: #fff; font-weight: 600; cursor: pointer; width: 100%; }
    .btn:disabled { opacity: 0.6; }
    .note { font-size: 12px; color: #57534e; margin-top: 4px; }
    .msg { margin-top: 10px; font-size: 12px; color: #047857; font-weight: 600; }
    .err { margin-top: 10px; font-size: 12px; color: #b91c1c; }
  </style>
</head>
<body>
  <label class="title">Chọn khách hàng</label>
  <select id="clientSelect" onchange="renderClient()"></select>

  <label class="title">Giai đoạn ĐƯỢC MỞ (khách nhìn thấy trên link)</label>
  <div class="grid">
    <label class="chk"><input type="checkbox" id="open1" value="1"> Giai đoạn 1 (Discovery)</label>
    <label class="chk"><input type="checkbox" id="open2" value="2"> Giai đoạn 2 (Định vị)</label>
    <label class="chk"><input type="checkbox" id="open3" value="3"> Giai đoạn 3 (Nội dung)</label>
    <label class="chk"><input type="checkbox" id="open4" value="4"> Giai đoạn 4 (Đo lường)</label>
  </div>

  <label class="title">Giai đoạn ĐÃ KHÓA (chỉ xem lại, không cho sửa)</label>
  <div class="grid">
    <label class="chk"><input type="checkbox" id="lock1" value="1"> Khóa GĐ 1</label>
    <label class="chk"><input type="checkbox" id="lock2" value="2"> Khóa GĐ 2</label>
    <label class="chk"><input type="checkbox" id="lock3" value="3"> Khóa GĐ 3</label>
    <label class="chk"><input type="checkbox" id="lock4" value="4"> Khóa GĐ 4</label>
  </div>
  <div class="note">Mẹo: Khi mở GĐ2, nên tích "Khóa GĐ 1" để bảo toàn dữ liệu GĐ1 đã nghiệm thu.</div>

  <div style="display:flex; gap:10px;">
    <div style="flex:1;">
      <label class="title">Nhánh kinh doanh</label>
      <select id="branchSelect">
        <option value="">(Trống – khách tự chọn)</option>
        <option value="A">Nhánh A (Đã có KD)</option>
        <option value="B">Nhánh B (Chưa có KD)</option>
      </select>
    </div>
    <div style="flex:1;">
      <label class="title">Trạng thái link</label>
      <select id="statusSelect">
        <option value="active">Đang mở (active)</option>
        <option value="closed">Đã đóng link (closed)</option>
      </select>
    </div>
  </div>

  <button id="saveBtn" class="btn" onclick="saveChanges()">Lưu cấu hình giai đoạn</button>
  <div id="msgBox" class="msg"></div>
  <div id="errBox" class="err"></div>

  <script>
    var clientsMap = {};
    google.script.run.withSuccessHandler(function (data) {
      var sel = document.getElementById('clientSelect');
      data.clients.forEach(function (c) {
        clientsMap[c.client_id] = c;
        var opt = document.createElement('option');
        opt.value = c.client_id;
        opt.textContent = c.client_id + ' – ' + c.name + ' (' + (c.status === 'closed' ? 'đã đóng' : 'mở GĐ ' + c.stages_open.join(',')) + ')';
        sel.appendChild(opt);
      });
      renderClient();
    }).adminGetInitData();

    function renderClient() {
      var cid = document.getElementById('clientSelect').value;
      var c = clientsMap[cid];
      if (!c) return;
      [1, 2, 3, 4].forEach(function (s) {
        document.getElementById('open' + s).checked = c.stages_open.indexOf(s) !== -1;
        document.getElementById('lock' + s).checked = c.stages_locked.indexOf(s) !== -1;
      });
      document.getElementById('branchSelect').value = c.branch || '';
      document.getElementById('statusSelect').value = c.status || 'active';
      document.getElementById('msgBox').textContent = '';
      document.getElementById('errBox').textContent = '';
    }

    function saveChanges() {
      var cid = document.getElementById('clientSelect').value;
      if (!cid) return;
      var openArr = [1, 2, 3, 4].filter(function (s) { return document.getElementById('open' + s).checked; });
      var lockArr = [1, 2, 3, 4].filter(function (s) { return document.getElementById('lock' + s).checked; });
      var btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.textContent = 'Đang lưu...';

      google.script.run
        .withSuccessHandler(function (res) {
          btn.disabled = false;
          btn.textContent = 'Lưu cấu hình giai đoạn';
          clientsMap[cid].stages_open = openArr;
          clientsMap[cid].stages_locked = lockArr;
          clientsMap[cid].branch = res.branch;
          clientsMap[cid].status = res.status;
          document.getElementById('msgBox').textContent = '✅ Đã cập nhật! Mở: [' + (res.stages_open || 'trống') + '] | Khóa: [' + (res.stages_locked || 'trống') + ']';
        })
        .withFailureHandler(function (e) {
          btn.disabled = false;
          btn.textContent = 'Lưu cấu hình giai đoạn';
          document.getElementById('errBox').textContent = e.message || String(e);
        })
        .adminUpdateClientStages({
          client_id: cid,
          stages_open: openArr,
          stages_locked: lockArr,
          branch: document.getElementById('branchSelect').value,
          status: document.getElementById('statusSelect').value
        });
    }
  </script>
</body>
</html>
