<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; color: #1c1917; margin: 0; padding: 14px; background: #faf9f6; }
    label { display: block; font-weight: 600; margin: 10px 0 4px; color: #292524; }
    input, select, textarea { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #d6d3d1; border-radius: 6px; font-size: 13px; font-family: inherit; background: #fff; }
    textarea { min-height: 76px; resize: vertical; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    .btn { margin-top: 14px; padding: 10px 14px; border: none; border-radius: 6px; background: #0f5257; color: #fff; font-weight: 600; cursor: pointer; width: 100%; font-size: 13px; }
    .btn:disabled { opacity: 0.6; cursor: wait; }
    .btn-secondary { background: #44403c; margin-top: 8px; }
    .result { display: none; margin-top: 14px; padding: 12px; background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 8px; }
    .link-box { word-break: break-all; font-family: monospace; background: #fff; padding: 8px; border-radius: 4px; border: 1px solid #d1fae5; margin: 6px 0; font-size: 12px; }
    .warn { color: #b45309; font-size: 12px; margin-top: 6px; }
    .err { color: #b91c1c; font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="formWrap">
    <div class="row">
      <div>
        <label>Tên khách hàng *</label>
        <input id="name" placeholder="VD: Nguyễn Minh Anh" autofocus>
      </div>
      <div>
        <label>Lĩnh vực chuyên môn</label>
        <input id="field" placeholder="VD: Nha khoa thẩm mỹ">
      </div>
    </div>

    <div class="row">
      <div>
        <label>Bộ câu hỏi (Template)</label>
        <select id="template"></select>
      </div>
      <div>
        <label>Hạn hoàn thành (tuỳ chọn)</label>
        <input id="deadline" placeholder="VD: 28/11/2026">
      </div>
    </div>

    <label>Lời chào riêng (để trống sẽ dùng mẫu mặc định có {name}, {field})</label>
    <textarea id="intro" placeholder="Chào {name}, ..."></textarea>

    <button id="submitBtn" class="btn" onclick="createClient()">Tạo khách &amp; Sinh mã link</button>
    <div id="errBox" class="err"></div>
  </div>

  <div id="resultBox" class="result">
    <strong>✅ Đã tạo khách <span id="resId"></span></strong>
    <div style="margin-top:4px;font-size:12px;">Nhánh mặc định: <b id="resBranch"></b></div>
    <div id="resLink" class="link-box"></div>
    <button class="btn" onclick="copyLink()">📋 Copy đường link gửi khách</button>
    <div id="noUrlWarn" class="warn" style="display:none;">
      ⚠️ Bạn chưa cài đặt URL GitHub Pages. Hãy vào menu <b>⚙️ Tư vấn THCN → Cài đặt URL trang khách</b> để lần sau tự ghép link đầy đủ.
    </div>
    <button class="btn btn-secondary" onclick="google.script.host.close()">Đóng</button>
  </div>

  <script>
    var createdLink = '';
    google.script.run.withSuccessHandler(function (data) {
      var sel = document.getElementById('template');
      data.templates.forEach(function (t) {
        var opt = document.createElement('option');
        opt.value = t.template_id;
        opt.textContent = t.template_id + ' – ' + t.description;
        sel.appendChild(opt);
      });
    }).adminGetInitData();

    function createClient() {
      var err = document.getElementById('errBox');
      err.textContent = '';
      var btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Đang tạo...';

      google.script.run
        .withSuccessHandler(function (res) {
          createdLink = res.link;
          document.getElementById('formWrap').style.display = 'none';
          document.getElementById('resultBox').style.display = 'block';
          document.getElementById('resId').textContent = res.client_id;
          document.getElementById('resBranch').textContent = res.branch || 'Khách tự chọn ở GĐ2';
          document.getElementById('resLink').textContent = res.link;
          if (!res.hasBaseUrl) document.getElementById('noUrlWarn').style.display = 'block';
        })
        .withFailureHandler(function (e) {
          btn.disabled = false;
          btn.textContent = 'Tạo khách & Sinh mã link';
          err.textContent = e.message || String(e);
        })
        .adminCreateClient({
          name: document.getElementById('name').value,
          field: document.getElementById('field').value,
          template: document.getElementById('template').value,
          deadline: document.getElementById('deadline').value,
          intro: document.getElementById('intro').value
        });
    }

    function copyLink() {
      navigator.clipboard.writeText(createdLink).then(function () {
        alert('Đã copy link vào bộ nhớ tạm!');
      });
    }
  </script>
</body>
</html>
