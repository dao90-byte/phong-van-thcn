<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; color: #1c1917; margin: 0; padding: 14px; background: #faf9f6; }
    .row { display: flex; gap: 8px; }
    .row > div { flex: 1; }
    label.title { display: block; font-weight: 600; margin: 10px 0 4px; }
    select, input, textarea { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #d6d3d1; border-radius: 6px; background: #fff; font-size: 13px; font-family: inherit; }
    .chk-box { background: #fff; border: 1px solid #e7e5e4; border-radius: 8px; padding: 10px; }
    .chk { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; cursor: pointer; line-height: 1.4; }
    .chk input { width: auto; margin-top: 2px; }
    textarea { min-height: 110px; resize: vertical; }
    .btn { margin-top: 12px; padding: 10px; border: none; border-radius: 6px; background: #0f5257; color: #fff; font-weight: 600; cursor: pointer; width: 100%; }
    .msg { margin-top: 8px; font-size: 12px; color: #047857; font-weight: 600; }
    .sub-badge { font-size: 12px; color: #57534e; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="row">
    <div style="flex:2;">
      <label class="title">Khách hàng</label>
      <select id="clientSelect" onchange="loadReview()"></select>
    </div>
    <div>
      <label class="title">Giai đoạn</label>
      <select id="stageSelect" onchange="loadReview()">
        <option value="1">Giai đoạn 1</option>
        <option value="2">Giai đoạn 2</option>
        <option value="3">Giai đoạn 3</option>
        <option value="4">Giai đoạn 4</option>
      </select>
    </div>
    <div>
      <label class="title">Đợt</label>
      <input id="roundInput" value="R1" onchange="loadReview()">
    </div>
  </div>
  <div id="submittedInfo" class="sub-badge"></div>

  <label class="title">4 mục nghiệm thu giai đoạn</label>
  <div class="chk-box">
    <label class="chk"><input type="checkbox" id="c1"><span id="l1"></span></label>
    <label class="chk"><input type="checkbox" id="c2"><span id="l2"></span></label>
    <label class="chk"><input type="checkbox" id="c3"><span id="l3"></span></label>
    <label class="chk" style="margin-bottom:0;"><input type="checkbox" id="c4"><span id="l4"></span></label>
  </div>

  <label class="title">Nhận xét của nhà tư vấn</label>
  <textarea id="reviewNote" style="min-height:60px;" placeholder="Ghi nhận điểm chưa đạt hoặc cần làm rõ thêm..."></textarea>

  <label class="title">Tóm tắt chốt giai đoạn (approved_summary – tự động đính kèm sang GĐ sau)</label>
  <textarea id="approvedSummary" placeholder="Dán khối TÓM TẮT CHỐT GĐ1/GĐ2 (8–10 gạch đầu dòng) từ LLM sau khi anh/chị đã kiểm duyệt..."></textarea>

  <button id="saveBtn" class="btn" onclick="saveReview()">💾 Lưu nghiệm thu &amp; Tóm tắt</button>
  <div id="msgBox" class="msg"></div>

  <script>
    var checklistLabels = {};
    google.script.run.withSuccessHandler(function (data) {
      checklistLabels = data.checklistLabels;
      var sel = document.getElementById('clientSelect');
      data.clients.forEach(function (c) {
        var opt = document.createElement('option');
        opt.value = c.client_id;
        opt.textContent = c.client_id + ' – ' + c.name;
        sel.appendChild(opt);
      });
      loadReview();
    }).adminGetInitData();

    function loadReview() {
      var cid = document.getElementById('clientSelect').value;
      var stage = document.getElementById('stageSelect').value;
      var labels = checklistLabels[stage] || checklistLabels['2'] || [];
      for (var i = 0; i < 4; i++) {
        document.getElementById('l' + (i + 1)).textContent = 'Mục ' + (i + 1) + ': ' + (labels[i] || '');
      }
      if (!cid) return;
      document.getElementById('msgBox').textContent = '';

      google.script.run.withSuccessHandler(function (r) {
        document.getElementById('submittedInfo').textContent = r.submitted_at
          ? '✅ Khách đã bấm nộp bài lúc: ' + r.submitted_at
          : '⏳ Khách chưa bấm nút Hoàn tất nộp bài cho giai đoạn này.';
        document.getElementById('c1').checked = !!r.check_1;
        document.getElementById('c2').checked = !!r.check_2;
        document.getElementById('c3').checked = !!r.check_3;
        document.getElementById('c4').checked = !!r.check_4;
        document.getElementById('reviewNote').value = r.review_note || '';
        document.getElementById('approvedSummary').value = r.approved_summary || '';
      }).adminGetStageReview(cid, stage, document.getElementById('roundInput').value);
    }

    function saveReview() {
      var btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.textContent = 'Đang lưu...';
      google.script.run
        .withSuccessHandler(function () {
          btn.disabled = false;
          btn.textContent = '💾 Lưu nghiệm thu & Tóm tắt';
          document.getElementById('msgBox').textContent = '✅ Đã lưu vào StageReviews! Tóm tắt này sẽ tự động nối vào bản xuất của giai đoạn sau.';
        })
        .withFailureHandler(function (e) {
          btn.disabled = false;
          btn.textContent = '💾 Lưu nghiệm thu & Tóm tắt';
          alert(e.message || String(e));
        })
        .adminSaveStageReview({
          client_id: document.getElementById('clientSelect').value,
          stage: document.getElementById('stageSelect').value,
          round: document.getElementById('roundInput').value,
          check_1: document.getElementById('c1').checked,
          check_2: document.getElementById('c2').checked,
          check_3: document.getElementById('c3').checked,
          check_4: document.getElementById('c4').checked,
          review_note: document.getElementById('reviewNote').value,
          approved_summary: document.getElementById('approvedSummary').value
        });
    }
  </script>
</body>
</html>
